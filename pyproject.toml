[project]
name = "text-to-sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hiren9979", email = "hirenchavda141@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "sqlglot>=30.18.0",
    "uvicorn>=0.53.0",
    "pyyaml>=6.0.3",
    "langchain-groq>=1.1.3",
]

[project.scripts]
text-to-sql = "text_to_sql:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
